[project]
name = "gpu-pde-lab"
version = "0.1.0"
description = "An interactive laboratory for exploring GPU-accelerated numerical PDE solvers"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "pyqtgraph",
    "PyOpenGL",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
