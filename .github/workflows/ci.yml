name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 links libEGL and libGL at import time even under the offscreen
      # platform plugin, and six test modules import Qt widgets. The runner
      # image does not ship these, so without this step collection dies on
      # "libEGL.so.1: cannot open shared object file" before a single test
      # runs. Same set as the Dockerfile.
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libfontconfig1 libxcb-cursor0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the CUDA wheels are ~2.5 GB and no GitHub-hosted
          # runner has a GPU to use them with. Tests that need a device skip
          # themselves through cuda_is_usable(), so this exercises every
          # numerical path that does not require one.
          #
          # --index-url rather than --extra-index-url on purpose: with both
          # indexes in play pip is free to prefer PyPI's torch, which on Linux
          # is the CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Show environment
        run: |
          python -c "import torch, numpy, sys; print('python', sys.version)"
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Run tests
        env:
          # No display on the runner; the Qt widget tests need a platform
          # plugin that does not open one. conftest.py sets this too, but
          # setting it here covers anything imported before conftest runs.
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # No Qt system libraries here: mypy is scoped to core/, kernels/ and
      # benchmarking/, none of which import PySide6, and ruff parses rather
      # than imports. Installing the wheel is enough; only importing it would
      # need libEGL.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests scripts

      - name: ruff format check
        run: ruff format --check --diff src tests scripts
        continue-on-error: true

      - name: mypy
        run: mypy
